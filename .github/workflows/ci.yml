name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on known bash scripts
        run: |
          find . \( -path './.git' -o -path './node_modules' -o -path './.tasks' \) -prune -o \
            -type f \( -name '*.sh' -o -name '*.bats' \) \
            -print \
            | xargs shellcheck --severity=error --shell=bash --enable=all

  bats-tests:
    name: BATS Tests (non-e2e)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test Docker image
        run: docker build -f Dockerfile.test -t tasks-bash-tests .

      - name: Run make test (excludes e2e)
        run: docker run --rm tasks-bash-tests make test

  lint-and-test:
    name: Full CI Pipeline
    runs-on: ubuntu-latest
    needs: [shellcheck, bats-tests]
    steps:
      - name: CI Summary
        run: |
          echo "✅ All checks passed:"
          echo "  - ShellCheck (strict mode)"
          echo "  - BATS (non-e2e) via make test"
