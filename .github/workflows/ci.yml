name: CI

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck (Strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck on known bash scripts
        run: |
          find . \( -path './.git' -o -path './node_modules' -o -path './.tasks' \) -prune -o \
            -type f \( -name '*.sh' -o -name '*.bats' \) \
            -print0 \
            | xargs -0 shellcheck --severity=error --shell=bash --enable=all

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [shellcheck]
    steps:
      - name: CI Summary
        run: |
          echo "✅ All checks passed:"
          echo "  - ShellCheck (strict mode)"
